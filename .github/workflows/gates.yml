name: gates

# Validates the vendored glyphs and the generated packs on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-rsvg-2.0 python3-numpy python3-pil

      - name: Vendored upstream glyph gate
        run: python3 tools/dev/check_upstream_assets.py

      # Snapshot the committed cursor TOC structure before the rebuild overwrites it.
      - name: Snapshot committed cursor structure
        run: python3 tools/dev/check_cursor_structure.py --dump > /tmp/cursors-before.txt

      - name: Build icon pack
        run: python3 tools/icons/generate_icons.py

      - name: Build cursor pack
        run: python3 tools/icons/generate_cursors.py

      # SVG output is deterministic Python; PNG and Xcursor rasterisation depend on the runner's
      # librsvg/Pillow build, so only the vector artwork is compared byte for byte.
      # -N (intent-to-add) pulls freshly generated but uncommitted files into the diff too.
      - name: Committed SVG artwork is up to date
        run: |
          git add -N src
          git diff --exit-code -- ':(glob)src/icons/**/*.svg' ':(glob)src/icons/**/index.theme' ':(glob)src/cursors/**/index.theme'

      # Xcursor pixel bytes depend on the runner's Pillow build, but the struct-packed TOC
      # (frames, sizes, hotspots, delays) is deterministic and must not drift.
      - name: Cursor structure is up to date
        run: |
          python3 tools/dev/check_cursor_structure.py
          python3 tools/dev/check_cursor_structure.py --dump > /tmp/cursors-after.txt
          diff -u /tmp/cursors-before.txt /tmp/cursors-after.txt

      - name: Pack structure gate
        run: python3 tools/dev/validate_icons.py

      - name: Package and validate the archive
        run: |
          sh tools/icons/package.sh
          python3 tools/dev/check_release_archive.py
